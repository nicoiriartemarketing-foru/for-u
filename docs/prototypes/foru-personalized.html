  };
  const arr = value => Array.isArray(value) ? value : value ? [value] : [];

  function derive(route, answers = {}) {

    const short = answers.time === 'Sesiones breves';
    const format = showFace || voice ? 'story' : 'portrait';
    const style = noPhoto ? 'Composición tipográfica' : 'Tus recursos, en primer plano';
    const contentPath = showFace ? 'Guion breve → ensayo → grabación' : voice ? 'Texto claro → voz → portada' : 'Idea → texto y diseño → publicación';
    const reasons = [
      noPhoto ? 'No has elegido fotos: empezamos con tipografía y tu mensaje.' : 'Elegiste material propio: primero lo podrás ordenar en tu biblioteca.',
      avoid.includes('Mostrar mi cara') ? 'Prefieres no mostrar tu cara. No te pediremos hacerlo.' : showFace ? 'Te resulta cómodo hablar a cámara: tu guion estará cerca.' : voice ? 'Tu voz puede acompañar el diseño sin que tengas que aparecer a cámara.' : 'Puedes empezar escribiendo; grabar sigue siendo opcional.',
      short ? 'Elegiste sesiones breves: destacamos un solo paso cada vez.' : 'Tu ritmo es editable. Las fechas las decides tú.',

    ];

    const next = answers.goal === 'Ordenar mi operación' ? 'operation' : answers.goal === 'Crear contenido' ? 'studio' : answers.goal === 'Vender una oferta' ? 'offers' : 'page';
    const phase = Math.max(0, moments.indexOf(answers.intent));
    const sections = arr(answers.sections).filter(x => routeOptions[route].sections.includes(x));
    const title = meaningful(answers.projectName) ? answers.projectName.trim() : 'Tu proyecto, a tu manera';
    const topic = meaningful(answers.offerCustom) ? answers.offerCustom.trim() : meaningful(answers.offering) ? answers.offering : '';
    const specs = [];
    const add = (id, area, text, tool, reason) => specs.push({ id, area, title: text, tool, reason, status: 'todo', date: '', acceptance: 'suggested' });
    if (next === 'operation') add('route-operation', 'operations', route === 'courses' ? 'Ordenar mi primer módulo' : route === 'services' ? 'Ordenar mis solicitudes' : 'Ordenar mi atención', 'operation', 'Elegiste ordenar la operación de un negocio que ya tiene recorrido.');
    if (next === 'offers') add('route-offer', 'marketing', 'Dar forma a mi oferta especial', 'offers', 'Elegiste vender una oferta: primero confirmaremos su beneficio y condiciones.');
    add('route-page', 'marketing', 'Revisar mi página preparada', 'page', sections.length ? 'Elegiste estas secciones: ' + sections.slice(0, 3).join(', ') + '.' : 'Tu página puede empezar con una estructura pequeña y ampliarse después.');
    add('route-content', 'marketing', voice || showFace ? 'Preparar mi primer guion' : 'Dar forma a mi primer contenido', 'studio', (short ? 'Tienes poco tiempo. ' : '') + (noPhoto ? 'Podemos empezar sin fotografías.' : 'Elegiste reutilizar tus materiales.') + ' ' + contentPath + '.');
    if (arr(answers.otherAreas).includes('Finanzas')) add('route-cost', 'finance', answers.cost === 'Sí' ? 'Revisar mis costos registrados' : 'Entender el costo de mi oferta', 'operation', 'Elegiste preparar Finanzas' + (answers.cost ? ' y sobre costos respondiste «' + answers.cost + '».' : '.'));

    if (arr(answers.otherAreas).includes('Operaciones') && !specs.some(t => t.area === 'operations')) add('route-process', 'operations', 'Organizar mi siguiente solicitud', 'operation', 'Elegiste preparar Operaciones' + (answers.tracking ? ' y hoy organizas pendientes con «' + answers.tracking + '».' : '.'));
    if (resources.length && !resources.includes('Ninguno todavía') && answers.friction === 'Me cuesta organizarme') add('route-library', 'logistics', 'Ordenar mis materiales', 'library', 'Tienes material y elegiste organización como ayuda principal.');
    if (next === 'studio') specs.sort((a, b) => Number(b.id === 'route-content') - Number(a.id === 'route-content'));
    return { name: title, topic, stage, next, phase, format, style, contentPath, reasons, sections, tasks: specs, noPhoto, short, showFace, voice, diffusion: answers.diffusion || 'Por decidir', channel: answers.channel || 'Por decidir' };
  }
  function mergeTasks(existing, proposed) {
    const old = new Map(existing.map(x => [x.id, x]));

  }
  return { moments, routeOptions, arr, meaningful, derive, mergeTasks };
})();

function onboarding(){const q=questions[state.step];const value=state.answers[q.key]||'';return `${reviewLabel()}<div class="chrome">${brand()}<span class="grow"></span>${button('Crear manualmente '+icon('arrow-up-right'),'manual','ghost')}</div><main class="content"><section class="question-wrap"><div class="steps" aria-label="Momento ${q.moment+1} de 7">${[0,1,2,3,4,5,6].map(i=>`<span class="${i<=q.moment?'current':''}"></span>`).join('')}</div><div class="question-art">${icon(q.icon)}</div><span class="eyebrow">${q.label}</span><h1>${q.title}</h1><p class="explain">${q.why}</p><div class="answer">${q.options?`<div class="answer-options">${q.options.map(v=>button(h(v),'answer',value===v?'active':'',v)).join('')}</div>`:q.long?`<label><span class="sr-label">${q.title}</span><textarea data-answer placeholder="${q.hint}">${h(value)}</textarea></label>`:`<label><span class="sr-label">${q.title}</span><input data-answer placeholder="${q.hint}" value="${h(value)}"></label>`}</div>${!q.options?button(icon('mic')+' Prefiero contarlo por audio','voice','ghost'):''}${voiceOpen?`<div class="notice section-gap">Audio en la maqueta: no activa el micrófono. En la app podrás grabar, escuchar y decidir cuándo interpretar tu respuesta.${button('Usar una respuesta de muestra','voice-example','soft')}</div>`:''}<div class="question-actions">${state.step?button(icon('arrow-left')+' Atrás','question-back','ghost'):''}${button(state.step===questions.length-1?'Ver cómo toma forma '+icon('arrow-right'):'Continuar '+icon('arrow-right'),'question-next','primary')}</div><div class="question-actions">${button('Lo definiré después','question-next','ghost')}</div></section></main>`;}

function page(){const route=routes[state.route],project=p();return `${breadcrumb('Mi página')}<div class="editor-toolbar"><div class="row"><strong>${h(project.name)}</strong><span class="pill">${route.label}</span></div><div class="row">${button(icon('monitor')+' Escritorio','viewport',!state.mobilePage?'soft':'','desktop')}${button(icon('smartphone')+' Móvil','viewport',state.mobilePage?'soft':'','mobile')}${button(icon('undo-2'),'undo','ghost')}${button(icon('ellipsis'),'page-settings','ghost')}${button(state.dirty?'Guardar borrador':'Publicar maqueta','save-page','primary')}</div><span class="status" data-save-status>${state.dirty?'Cambios en la maqueta':'Borrador de demostración · sin publicación real'}</span></div><div class="edit-layout ${state.panel&&['product','page-settings','section','photo','cta'].includes(state.panel.type)?'has-panel':''}"><article class="website ${state.mobilePage?'mobile-page':''}" aria-label="Página editable de ${h(project.name)}"><div class="web-nav"><strong class="web-wordmark">${h(project.name)}</strong><div class="row">${button(route.offer,'web-menu','ghost')}${button('Contacto','section','ghost','Contacto')}</div></div><section class="web-hero"><div><span class="eyebrow">${route.label}</span><h1 class="editable" role="textbox" aria-label="Editar título de página" contenteditable="true" data-edit="hero">${h(project.hero)}</h1><p class="editable" role="textbox" aria-label="Editar descripción de página" contenteditable="true" data-edit="description">${h(project.description)}</p>${button(h(project.cta||route.cta),'cta','web-cta')}</div>${state.route==='restaurant'?`<div class="cup-scene" aria-label="Ilustración de café de muestra"><span class="cup"></span></div>`:`<div class="cup-scene"><div class="symbol-art" style="border-radius:45%">${icon(route.icon)}</div></div>`}</section><div class="add-section">${button(icon('plus')+' Sección','add-section')}</div><section class="web-menu" id="fu-menu"><div class="row between"><div><small class="eyebrow">${state.route==='restaurant'?'ALGO RICO PARA TU PAUSA':'TU OFERTA'}</small><h2>${route.offer}</h2></div>${button(icon('plus')+' Añadir','product','', 'new')}</div>${project.products.some(x=>x.price)?'<small class="muted">Importes de muestra para explorar la maqueta.</small>':''}<div class="product-grid">${publicProducts().map(item=>`<article class="product"><button type="button" class="product-art mini-art" data-action="product" data-value="${item.id}" aria-label="Editar ${h(item.name)}">${art(item.art,item.image)}</button><div class="product-info"><h3>${h(item.name)}</h3><p>${h(item.description)}</p><div class="row between"><span class="price">${item.price?money(item.price):state.route==='services'?'Solicitar cotización':'Añadir precio'}</span>${button(item.placeholder?'Completar':'Editar','product','',item.id)}</div>${!item.placeholder?button('Crear contenido '+icon('sparkles'),'from-product','',item.id):''}</div></article>`).join('')}</div></section><div class="add-section">${button(icon('plus')+' Sección','add-section')}</div><div class="web-fulfill">${project.config.modes.length?project.config.modes.map(m=>({table:'Mesa',pickup:'Recojo',delivery:'Delivery'}[m])).join(' · '):state.route==='restaurant'?button('Configurar cómo atiendes','fulfillment','ghost'):route.op[0]}${project.config.start?` · ${project.config.start}–${project.config.end}`:''}</div><section class="web-details"><div><h3>${state.route==='restaurant'?'Un lugar para tus ideas':route.sections[1]}</h3><p class="editable" role="textbox" aria-label="Editar historia de página" contenteditable="true" data-edit="story">${h(project.story||'Toca aquí para contar tu historia. Este texto de orientación no se publica.')}</p></div><div><h3>${state.route==='restaurant'?'Encuéntranos':route.sections[3]}</h3><p>${h(project.config.address||'Añade tu ubicación o forma de contacto.')}</p>${button('Editar información','fulfillment','ghost')}</div></section>${project.sections.filter(s=>!route.sections.slice(0,2).includes(s)&&!['Ubicación y horarios','Contacto'].includes(s)).map(section=>`<section class="web-extra"><div class="row between"><h3>${h(section)}</h3>${button(icon('pencil')+' Editar','section','ghost',section)}</div><p>${h(project['section-'+section]||'Completa esta sección cuando la necesites.')}</p>${button(icon('sparkles')+' Crear contenido de esta sección','from-section','ghost',section)}</section>`).join('')}<footer class="web-footer">${h(project.name)} · Vista de edición. Las ilustraciones y textos de orientación son de muestra.</footer></article>${renderEditorPanel()}</div><p class="tiny muted section-gap">Toca un texto para editarlo. Selecciona una oferta para cambiar sus datos.</p>`;}
function renderEditorPanel(){const panel=state.panel;if(!panel)return '';if(panel.type==='product'){let item=p().products.find(x=>x.id===panel.id);const placeholder=!item;item=item||{id:'new',name:'',description:'',price:'',art:state.route==='restaurant'?'coffee':'symbol'};return `<aside class="edit-panel" aria-label="Editar oferta"><div class="row between"><h3>${placeholder?'Tu primera oferta':'Tu oferta'}</h3>${button(icon('x'),'close','ghost')}</div><form data-form="product">${field('Nombre','name',item.name)}${textField('Descripción','description',item.description)}${field(state.route==='services'?'Precio opcional · vacío = cotización':'Precio confirmado · vacío = pendiente','price',item.price,'number')}<label class="field">Imagen de muestra<select name="art"><option value="coffee"${item.art==='coffee'?' selected':''}>Ilustración de café</option><option value="alfajor"${item.art==='alfajor'?' selected':''}>Ilustración de alfajor</option><option value="symbol"${!['coffee','alfajor'].includes(item.art)?' selected':''}>Sin fotografía</option></select></label><label class="field">Añadir tu foto<input type="file" accept="image/jpeg,image/png,image/webp" data-upload="product"></label><details><summary>Presentaciones, extras y condiciones</summary><p class="tiny muted">En la app se editan en este mismo producto del catálogo. Esta maqueta no modifica precios ni opciones reales.</p></details><button class="primary" type="submit">${placeholder?'Incorporar a mi menú':'Guardar oferta'}</button></form></aside>`;}
if(panel.type==='page-settings')return `<aside class="edit-panel"><div class="row between"><h3>Tu página</h3>${button(icon('x'),'close','ghost')}</div><form data-form="page-settings">${field('Nombre del proyecto','name',p().name)}${field('Mensaje principal','hero',p().hero)}${textField('Descripción','description',p().description)}<button type="submit" class="primary">Aplicar al borrador</button></form><hr class="rule">${button('Volver a las preguntas','resume','ghost')}${button('Ver publicación de muestra','preview-page','soft')}</aside>`;
if(panel.type==='section')return `<aside class="edit-panel"><div class="row between"><h3>${h(panel.id)}</h3>${button(icon('x'),'close','ghost')}</div><form data-form="section">${textField('Tu información','body',p()['section-'+panel.id]||'')}<button class="primary" type="submit">Guardar esta sección</button></form></aside>`;
if(panel.type==='cta')return `<aside class="edit-panel"><div class="row between"><h3>El siguiente paso</h3>${button(icon('x'),'close','ghost')}</div><form data-form="cta">${field('Texto del botón','cta',p().cta||routes[state.route].cta)}<p class="tiny muted" style="margin-bottom:14px">Lleva a tus ofertas dentro de esta página. Publicar será una acción separada.</p><button type="submit" class="primary">Aplicar</button></form></aside>`;return '';}
function studioNav(active){return `<nav class="studio-nav" aria-label="Creator Studio">${[['campaigns','flag','Campañas'],['create','sparkles','Crear'],['profile','layout-grid','Mi perfil'],['library','folder-open','Biblioteca']].map(([id,ic,label])=>button(icon(ic)+label,'studio-tab',active===id?'active':'',id)).join('')}</nav>`;}
function studio(){let content='';const project=p();if(state.studio==='campaigns'){content=head('Una intención. Muchas formas de contarla.','Cada campaña reúne su oferta, sus piezas y su calendario.',button(icon('plus')+' Crear campaña','new-campaign','primary'))+(project.campaigns.length?`<div class="grid2">${project.campaigns.map(c=>`<article class="surface"><span class="pill">${h(c.goal)}</span><h3 style="margin:14px 0 6px">${h(c.name)}</h3><p class="muted tiny">${project.pieces.filter(x=>x.campaignId===c.id).length} piezas · ${c.date||'Sin fecha todavía'}</p><div class="row section-gap">${button('Crear para esta campaña '+icon('arrow-right'),'campaign-create','primary',c.id)}${button('Ver en calendario','nav','ghost','calendar')}</div></article>`).join('')}</div>`:`<div class="next-step"><div><h3>Tu primera campaña empieza con una intención.</h3><p>Puedes crear contenido sin campaña y organizarlo después.</p></div>${icon('flag')}</div><div class="intent-grid">${[['megaphone','Dar a conocer','Que sepan qué haces.'],['tag','Presentar una oferta','Explicar lo que pueden elegir.'],['heart','Fidelizar','Seguir cerca de quienes ya confiaron.']].map(([ic,title,sub])=>`<button class="intent-card" data-action="new-campaign" data-value="${title}">${icon(ic)}<strong>${title}</strong><small>${sub}</small></button>`).join('')}</div>`)+`<div class="row section-gap">${button('Prefiero crear una pieza suelta '+icon('arrow-right'),'studio-tab','ghost','create')}</div>`;}
else if(state.studio==='create'){const campaign=project.campaigns.find(x=>x.id===state.campaignId);content=head('¿Qué quieres comunicar?','Elegimos la intención antes que el formato.')+`${campaign?`<div class="notice" style="margin-bottom:18px">Campaña · ${h(campaign.name)} ${button('Crear sin campaña','clear-campaign','ghost')}</div>`:''}<div class="chips" aria-label="Momento de venta">${phases.map((phase,i)=>button(phase,'phase',state.phase===i?'active':'',String(i))).join('')}</div><div class="row section-gap between"><div><h3>Tres maneras de darle forma.</h3><p class="tiny muted">Composiciones locales con tu información, sin generar imágenes ni llamar a IA.</p></div>${button('Elegir una sección de mi página','source-section','soft')}</div><div class="grid3 section-gap">${[0,1,2].map(i=>`<button class="template-choice" data-action="choose-template" data-value="${i}">${poster(previewPiece(i))}<span class="template-label"><strong>${['Editorial','Protagonista','Conversación'][i]}</strong><span>Usar esta composición ${icon('arrow-right')}</span></span></button>`).join('')}</div>`;}
else if(state.studio==='profile')content=profile();else content=library();return `${breadcrumb('Creator Studio')}${studioNav(state.studio)}${content}`;}
function previewPiece(template){const item=p().products.find(x=>x.id===state.sourceProduct)||p().products[0];let title=state.sourceSection?state.sourceSection:state.route==='restaurant'?template===2?'¿Hacemos una pausa?':'Café, ideas y algo dulce.':p().hero;let subtitle=item?item.description:p().description;if(!state.sourceSection){const titles=state.route==='restaurant'?['Un lugar para tus ideas.','¿Con quién harías una pausa?','Cada detalle cuenta.',item?.name||'Tu próxima oferta','¿Retomamos esa idea?','Gracias por ser parte.']:['Conoce '+p().name,'Conversemos sobre tu próximo paso','Así damos forma a lo que hacemos',item?.name||'Conoce nuestra oferta','Sigamos con tu idea','Gracias por acompañarnos'];title=titles[state.phase||0];if(state.phase===3&&item?.price)subtitle=[item.description,money(item.price)+' · importe de muestra'].join(' · ');}else if(state.sourceSection==='Nuestra historia')subtitle=p().story||'Tu historia, contada con tus palabras.';if(template===2&&state.phase===0)title='¿Y si tu idea empieza aquí?';return {title,subtitle,caption:[title,subtitle].filter(Boolean).join(' · '),brand:p().name,cta:state.route==='restaurant'?'Conoce nuestro menú':'Conoce nuestra propuesta',template,art:item?.art|| (state.route==='restaurant'?'coffee':'symbol'),image:item?.image||'',format:'portrait'};}
function poster(piece,large=false){return `<div class="poster ${piece.template===1?'mint-poster':piece.template===2?'violet-poster':''} ${large?'large':''} ${piece.format==='story'?'story':piece.format==='post'?'square':''}"><small>${h(piece.brand||p().name)}</small><div><h2 ${large?'class="editable" contenteditable="true" role="textbox" aria-label="Editar titular del diseño" data-edit="piece-title"':''}>${h(piece.title)}</h2><p ${large?'class="editable" contenteditable="true" role="textbox" aria-label="Editar texto del diseño" data-edit="piece-subtitle"':''}>${h(piece.subtitle)}</p></div><div class="poster-art">${art(piece.art,piece.image)}</div><strong>${h(piece.cta)}</strong></div>`;}
function piecePage(){const piece=currentPiece();if(!piece)return `<div class="empty">${icon('sparkles')}<h2>Tu próxima creación empieza aquí.</h2>${button('Elegir una propuesta','studio-tab','primary','create')}</div>`;const campaign=p().campaigns.find(c=>c.id===piece.campaignId);const dirty=state.dirty;return `${breadcrumb('Creator Studio / '+h(piece.title))}<div class="editor-toolbar"><div><strong>Tu pieza, a tu manera.</strong><br><small class="muted">${campaign?h(campaign.name):'Sin campaña'} · ${phases[piece.phase||0]}</small></div><div class="row">${button(icon('arrow-left')+' Crear','studio-tab','ghost','create')}${button(icon('undo-2'),'undo-piece','ghost')}${button(dirty?'Guardar pieza':'Guardada aquí','save-piece',dirty?'primary':'soft')}</div><span class="status" data-save-status>${dirty?'Cambios en la maqueta':'Planificación privada · no publicada en Instagram'}</span></div>${piece.sourceRevision!==p().rev?`<div class="notice" style="margin-bottom:15px">Tu página cambió. Tu diseño se conserva; puedes revisarlo o preparar otra variante.</div>`:''}<div class="piece-context" aria-label="Vistas de la pieza">${button('Diseño','piece-view',state.pieceView!=='caption'?'active':'','design')}${button('Texto del post','piece-view',state.pieceView==='caption'?'active':'','caption')}${button(icon('video')+' Crear video de este post','record','soft')}${button(icon('calendar-days')+' Planificar','plan-piece','ghost')}</div>${state.pieceView==='caption'?`<div class="text-preview"><div class="row between"><strong>${h(p().name)}</strong><small class="muted">Texto del post</small></div><p class="editable section-gap" role="textbox" aria-label="Editar texto del post" contenteditable="true" data-edit="caption">${h(piece.caption)}</p></div>`:`<div class="poster-stage">${poster(piece,true)}</div><div class="piece-context">${button(icon('image')+' Imagen','piece-image','ghost')}${button(icon('type')+' Texto y CTA','piece-text','ghost')}${button(icon('palette')+' Composición','piece-format','ghost')}</div>`}<div class="row between section-gap"><small class="muted">${piece.video?'Video y portada guardados en esta pieza.':'Tu diseño puede ser la portada de tu próximo reel.'}</small><div class="row">${button('Organizar en mi perfil','studio-tab','soft','profile')}${button('Exportar muestra','export','ghost')}</div></div>`;}
function profile(){const project=p();return `${head('Tu perfil también cuenta una historia.','Ordena primero tus tres principales. Después, el contenido que las acompaña.',button(icon('move')+(state.reorder?' Terminar orden':' Ordenar cuadrícula'),'reorder','soft'))}<section class="profile-cover"><div class="profile-top"><button class="profile-avatar" data-action="profile-info" aria-label="Editar identidad del perfil">${icon('user-round')}</button><div class="grow">${button(`<strong>${h(project.name)}</strong>`,'profile-info','ghost')}<p>${h(project.profileBio||'Tu biografía aparecerá aquí. Toca para darle forma.')}</p>${button('Editar biografía y enlace','profile-info','ghost')}</div></div><div class="highlights">${project.highlights.map((name,i)=>`<button class="highlight ghost" data-action="highlight" data-value="${i}"><span>${icon(['heart','coffee','map-pin'][i%3])}</span>${h(name)}</button>`).join('')}${button(icon('plus'),'highlight','ghost','new')}</div><div class="row between" style="padding:0 18px 12px"><small class="muted">Tus tres principales · después, contenido orgánico</small><span class="pill">Vista de planificación</span></div><div class="profile-grid">${[...project.pieces,...Array(Math.max(0,3-project.pieces.length)).fill(null)].map((piece,i)=>piece?`<article class="profile-tile" draggable="${state.reorder}" data-drag-piece="${piece.id}" data-drop-piece="${piece.id}"><button data-action="open-piece" data-value="${piece.id}" aria-label="Abrir ${h(piece.title)}">${poster(piece)}</button><span class="pin">${piece.video?'Reel · ':''}${i<3?h(piece.role||['Conóceme','Conversemos','Esto puedes elegir'][i]):'Orgánico'}</span>${state.reorder?`<div class="reorder">${button('←','move-piece','',piece.id+':-1')}${button('→','move-piece','',piece.id+':1')}</div>`:''}</article>`:`<div class="profile-tile">${button(`<span class="slot">${icon('plus')}<span>Tu publicación principal ${i+1}</span></span>`,'studio-tab','','create')}</div>`).join('')}</div></section><div class="row section-gap" style="justify-content:center">${button('Añadir contenido orgánico','studio-tab','primary','create')}${button('Ver lista y fechas','content-list','ghost')}${button('Ver calendario','nav','ghost','calendar')}</div>`;}
function library(){const files=p().files;return `${head('Todo lo que creas tiene su lugar.','Material del proyecto y piezas, sin perder el contexto.')}<div class="row section-gap between"><span class="muted tiny">${files.length} archivos añadidos en esta maqueta</span><label class="field" style="margin:0">Añadir material<input type="file" accept="image/*,audio/*,video/*" data-upload="library"></label></div><div class="grid3 section-gap">${files.map(f=>`<article class="library-file"><div class="library-art">${f.image?`<img src="${h(f.image)}" style="width:100%;height:100%;object-fit:cover;border-radius:12px" alt="Material añadido">`:icon(f.kind==='video'?'video':f.kind==='audio'?'mic':'image')}</div><div><strong>${h(f.name)}</strong><p class="tiny muted">${f.mock?'Muestra del recorrido':f.kind} · ${f.pieceId?'Vinculado a una pieza':'Material del proyecto'}</p></div>${f.pieceId?button('Abrir pieza','open-piece','soft',f.pieceId):button('Usar en una pieza','use-file','soft',f.id)}</article>`).join('')}</div>${!files.length?`<div class="empty section-gap">${icon('folder-open')}<h3>No necesitas traer todo desde el comienzo.</h3><p>Las fotos, audios, videos y portadas que añadas se reunirán aquí.</p></div>`:''}`;}
function recording(){const piece=currentPiece();if(!piece)return piecePage();const hasScript=Boolean(piece.script);return `${breadcrumb('Creator Studio / Video de este post')}<div class="row between" style="margin-bottom:20px"><div><h2>Tu post también puede tener voz.</h2><p class="muted tiny">Diseño → guion → grabación → portada</p></div>${button('Volver a mi pieza','open-piece','ghost',piece.id)}</div><div class="grid2"><div class="record-stage"><span class="pill">Grabación de demostración</span><div class="portrait">${icon('user-round')}</div><div class="record-text">${h(piece.script||'Tu guion aparecerá aquí, cerca de la cámara.')}</div><span class="tiny">${state.recordStep===1?'<span class="record-dot"></span> Demostración en curso':'La maqueta no activa cámara ni micrófono.'}</span></div><div class="stack" style="align-content:center"><span class="eyebrow">${state.recordStep<2?'PREPARAR Y ENSAYAR':'TU PORTADA, TU IDENTIDAD'}</span><h3>${state.recordStep<2?'Una idea clara, contada a tu manera.':'Guarda el video con su portada.'}</h3><p class="muted">${state.recordStep<2?'Tu guion y las tomas permanecen dentro de la misma pieza.':'Puedes usar el diseño vertical del post o elegir un fotograma. El encuadre de cuadrícula se revisa aparte.'}</p>${state.recordStep<2?`${button(icon('file-pen-line')+(hasScript?' Editar mi guion':' Escribir mi guion'),'script','soft')}${hasScript?button(state.recordStep===1?'Terminar toma de muestra':'Probar grabación','record-toggle','primary'):''}`:`${button('Usar diseño como portada','save-video','primary','design')}${button('Ver fotograma de muestra','save-video','soft','frame')}`}<details><summary>Tomas y formato</summary><p class="tiny muted">En la app, cámara y micrófono pedirán permiso al pulsar Grabar. El archivo indicará su formato real. El recorte y los subtítulos se comprobarán con una grabación real.</p></details></div></div>`;}
function operation(){const project=p(),route=routes[state.route],tab=state.opTab||0;let body='';if(state.route==='restaurant'){if(tab===0)body=`${head('Del menú a tu mesa de trabajo.','Los pedidos llegan a este mismo proyecto.',button('Probar un pedido','try-order','primary'))}<div class="row between"><span class="pill">${project.config.modes.length?project.config.modes.map(x=>({table:'Mesa',pickup:'Recojo',delivery:'Delivery'}[x])).join(' · '):'Atención por configurar'}</span>${button('Cómo atiendo y horarios','fulfillment','soft')}</div>${project.orders.length?project.orders.map(o=>`<div class="order-row"><div class="grow"><strong>Pedido de muestra #${o.number}</strong><p class="muted tiny">${h(o.name)} · ${h(o.mode)} · ${money(o.total)}</p></div><span class="pill">${orderNames[o.status]}</span>${button('Gestionar','manage-order','soft',o.id)}</div>`).join(''):`<div class="empty section-gap">${icon('receipt-text')}<h3>Los pedidos tendrán su lugar aquí.</h3><p>Configura tu atención y prueba el recorrido. No se envían pedidos a ningún negocio.</p></div>`}`;
else if(tab===1)body=head('Preparar también es organizar.','Recetas e inventario conectados a tus productos.')+`<div class="grid2">${publicProducts().map(item=>`<article class="surface"><h3>${h(item.name)}</h3><p class="muted tiny" style="margin:10px 0">Receta e ingredientes por definir. No descontamos inventario al recibir un pedido.</p>${button('Definir preparación','recipe','soft',item.id)}</article>`).join('')}</div>`;
else body=head('Conoce lo que cuesta hacer tu oferta.','Costos privados. Un dato que falta nunca se convierte en cero.',button(icon('plus')+' Registrar compra','purchase','primary'))+`<div class="grid2">${publicProducts().filter(x=>!x.placeholder).map(item=>`<article class="surface"><h3>${h(item.name)}</h3><p class="muted tiny">Precio de muestra: ${money(item.price)}</p><hr class="rule"><div class="row between"><span>Costo registrado</span><strong>${project.costs[item.id]!==undefined?money(project.costs[item.id]):'Incompleto'}</strong></div>${project.costs[item.id]!==undefined?`<p class="tiny muted section-gap">Precio menos costo: ${money(Number(item.price)-Number(project.costs[item.id]))}. No es utilidad neta.</p>`:''}${button('Definir costo','cost','soft section-gap',item.id)}</article>`).join('')}</div>${!project.products.length?`<div class="empty">${icon('notebook-pen')}<h3>Primero, tu primera oferta.</h3>${button('Ir a mi menú','nav','primary','page')}</div>`:''}<h3 class="section-gap">Tus compras</h3>${project.purchases.length?project.purchases.map(x=>`<div class="order-row"><span class="grow">${h(x.name)} · ${x.quantity} ${h(x.unit)}</span><strong>${money(x.amount)}</strong></div>`).join(''):'<p class="muted section-gap">Todavía no registraste compras de muestra.</p>'}`;
}else{const descriptions={ecommerce:'Productos, clientes y entregas del mismo negocio.',tourism:'Reservas, condiciones y horarios de tus experiencias.',hospitality:'Solicitudes y coordinación de estadías. Sin disponibilidad ficticia.',courses:'Módulos, lecciones, videos y materiales. Sin matrículas automáticas.',services:'Solicitudes, alcance y cotizaciones de tus ofertas.'};body=head(route.op[tab]||route.op[0],descriptions[state.route])+`<div class="empty">${icon(route.icon)}<h3>${state.route==='courses'?'Tu contenido, organizado para enseñar.':'Tu operación empieza con información real.'}</h3><p>${state.route==='courses'?'Organiza el temario, añade una lección y vincula sus materiales. La maqueta no concede acceso a un aula real.':'Aquí encontrarás los registros de esta ruta. La maqueta no simula reservas, ventas ni clientes reales.'}</p>${button(state.route==='courses'?'Organizar mi primer módulo':'Preparar una solicitud de muestra','route-operation','primary')}</div>`;}

else if(panel.type==='manage-order'){const order=project.orders.find(x=>x.id===panel.id);if(!order)return '';title='Pedido de muestra #'+order.number;const next={received:'accepted',accepted:'preparing',preparing:'ready',ready:order.mode==='Delivery'?'out_for_delivery':'completed',out_for_delivery:'completed'}[order.status];body=`<div class="row between"><strong>${h(order.name)}</strong><strong>${money(order.total)}</strong></div><p class="muted section-gap">${h(order.mode)} · pago por coordinar · simulación</p><p class="section-gap"><span class="pill">${orderNames[order.status]}</span></p><div class="row section-gap">${next?button('Marcar '+orderNames[next],'order-state','primary',order.id+':'+next):''}${!['cancelled','completed'].includes(order.status)?button('Cancelar muestra','order-state','ghost',order.id+':cancelled'):''}</div><p class="tiny muted section-gap">Historial: ${order.history.map(x=>orderNames[x]).join(' → ')}</p>`;}

function render(){const content=state.screen==='welcome'?welcome():state.screen==='onboarding'?onboarding():layout(({map,kanban,calendar,page,studio,piece:piecePage,record:recording,operation,results,world,settings,library:()=>breadcrumb('Creator Studio / Biblioteca')+studioNav('library')+library(),profile:()=>breadcrumb('Creator Studio / Mi perfil')+studioNav('profile')+profile()}[state.screen]||map)());shell.innerHTML=content;root.querySelectorAll('[data-fu-logo]').forEach(el=>el.src=LOGO);if(window.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
function setRoute(route){if(!routes[route])return;state.route=route;p();state.opTab=0;state.panel=null;state.pieceId=null;state.sourceProduct=null;state.sourceSection='';state.campaignId='';state.screen='map';persist();render();}
function createPiece(template){const value=previewPiece(template);const id=uid();p().pieces.push({...value,id,campaignId:state.campaignId||'',phase:state.phase,script:'',shots:'',date:'',status:'draft',sourceRevision:p().rev});state.pieceId=id;state.screen='piece';state.pieceView='design';state.dirty=true;state.panel=null;persist();render();}
function applyAnswer(){const q=questions[state.step],value=state.answers[q.key]||'';if(q.key==='route'&&value){const found=Object.entries(routes).find(([id,r])=>r.label===value);if(found)state.route=found[0];}const project=p();if(q.key==='name'&&value.trim())project.name=value.trim();if(['age','story','purpose','vision','audience','team','web','sales','goal'].includes(q.key))project[q.key]=value;if(q.key==='stage')state.scenario=value==='Ya tengo un negocio'?'existing':'new';}
root.addEventListener('click',event=>{const submit=event.target.closest('button[type=submit]');if(submit?.closest('form[data-form]')){event.preventDefault();submit.closest('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return;}const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const action=target.dataset.action,value=target.dataset.value;const project=p();
if(action==='nav'){if(value==='studio'){state.studio='campaigns';}if(value==='operation')state.opTab=0;go(value);return;}
if(action==='start'){state.screen='onboarding';state.step=0;state.panel=null;render();return;}
if(action==='explore'){state.scenario='new';go('map');return;}
if(action==='existing'||action==='scenario-existing'){state.scenario='existing';if(!project.products.length&&state.route==='restaurant')state.projects.restaurant=projectFor('restaurant',true);go('map');return;}
if(action==='scenario-new'){state.scenario='new';state.projects[state.route]=projectFor(state.route,false);go('map');return;}
if(action==='manual'){go('page');return;}
if(action==='resume'){state.screen='onboarding';state.step=0;state.panel=null;render();return;}
if(action==='answer'){state.answers[questions[state.step].key]=value;persist();render();return;}
if(action==='question-next'){applyAnswer();voiceOpen=false;if(state.step<questions.length-1){state.step++;render();persist();}else go('map');return;}

function guideEveryForm() {
  root.querySelectorAll('form[data-form]:not([data-guided])').forEach(form => {
    form.dataset.guided='true';
    form.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.tagName!=='TEXTAREA'&&event.target.tagName!=='BUTTON'){event.preventDefault();event.stopPropagation();nav.querySelector('.primary')?.click();}});
    const controls=[...form.querySelectorAll('input:not([type=hidden]),select,textarea')];
    if(!controls.length)return;
    const groups=[];
    controls.forEach((control,index)=>{
      const name=control.name||control.dataset.upload||'material-'+index;
      const same=['checkbox','radio'].includes(control.type)&&groups.find(g=>g.name===name);
      const label=control.closest('label');
      const node=label||control;
      if(label&&!['checkbox','radio'].includes(control.type)){
        [...label.childNodes].filter(n=>n.nodeType===3&&n.textContent.trim()).forEach(n=>{const caption=document.createElement('span');caption.className='sr-label';caption.textContent=n.textContent;n.replaceWith(caption);});
      }
      if(same){if(!same.nodes.includes(node))same.nodes.push(node);same.controls.push(control);}
      else groups.push({name,nodes:[node],controls:[control],label:label?.childNodes[0]?.textContent?.trim()||control.getAttribute('aria-label')||name});
    });
    const submit=form.querySelector('[type=submit]');
    const submitText=submit?.textContent||'Guardar';
    const extra=[...form.querySelectorAll('button[data-action]')].filter(b=>!b.closest('label'));
    const parked=document.createDocumentFragment();
    groups.forEach(g=>g.nodes.forEach(n=>parked.append(n)));
    form.replaceChildren();
    const view=document.createElement('div');view.className='single-question-flow';
    const stage=document.createElement('div');stage.className='single-question-stage';
    const nav=document.createElement('div');nav.className='guide-actions';
    const footer=document.createElement('div');footer.className='row section-gap';extra.forEach(b=>footer.append(b));
    view.append(stage,nav,footer);form.append(view);
    let index=0,review=false;
    // Campaigns begin with intention, then the offer; naming is secondary.
    if(form.dataset.form==='review-campaign')groups.sort((a,b)=>['goal','offer','name','date'].indexOf(a.name)-['goal','offer','name','date'].indexOf(b.name));
    function smallButton(text,handler,cls='ghost'){
      const b=document.createElement('button');b.type='button';b.className=cls+' cursor-interaction';b.textContent=text;b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();handler();});return b;
    }
    function show() {
      groups.forEach(g=>g.nodes.forEach(n=>parked.append(n)));stage.replaceChildren();nav.replaceChildren();
      if(review){
        const heading=document.createElement('h2');heading.textContent='Así queda. Tú decides.';stage.append(heading);
        const hint=document.createElement('p');hint.className='muted';hint.textContent='Puedes cambiar un detalle o guardar cuando quieras.';stage.append(hint);
        groups.forEach((g,i)=>{const row=document.createElement('div');row.className='review-item';const text=document.createElement('div');const title=document.createElement('strong');title.textContent=g.label;const value=document.createElement('p');value.textContent=g.controls.map(c=>['checkbox','radio'].includes(c.type)?(c.checked?c.value:''):c.tagName==='SELECT'?c.selectedOptions[0]?.textContent:c.type==='file'?(c.files?.[0]?.name||'Sin archivo'):c.value).filter(Boolean).join(' · ')||'Por definir';text.append(title,value);row.append(text,smallButton('Cambiar',()=>{index=i;review=false;show();}));stage.append(row);});
        nav.append(smallButton('Atrás',()=>{review=false;index=groups.length-1;show();}));
        const finish=document.createElement('button');finish.type='submit';finish.className='primary cursor-interaction';finish.textContent=submitText;
        // Reattach the exact controls synchronously before the existing handlers
        // inspect FormData. Their values and checked groups remain intact.
        finish.addEventListener('click',()=>{groups.forEach(g=>g.nodes.forEach(n=>{n.hidden=true;form.append(n);}));form.dataset.guidedReady='true';});nav.append(finish);return;
      }
      const g=groups[index],c=g.controls[0];
      const eyebrow=document.createElement('span');eyebrow.className='eyebrow';eyebrow.textContent=`UN DETALLE A LA VEZ · ${index+1} DE ${groups.length}`;
      const heading=document.createElement('h2');heading.textContent=questionTitles[g.name]||(c.type==='file'?'¿Quieres añadir una imagen?':g.label);
      const why=document.createElement('p');why.className='muted';why.textContent=c.type==='date'?'Es opcional. No pondremos una fecha por ti.':c.type==='number'?'Usa un dato confirmado o déjalo pendiente.':c.type==='file'?'También puedes seguir sin foto y añadirla después.':'Puedes cambiarlo después. No tienes que resolver todo ahora.';
      stage.append(eyebrow,heading,why);
      if(c.tagName==='SELECT'){
        const choices=document.createElement('div');choices.className='option-grid';
        [...c.options].forEach(option=>{const b=smallButton(option.textContent,()=>{c.value=option.value;choices.querySelectorAll('button').forEach(x=>{const on=x.dataset.choice===option.value;x.setAttribute('aria-pressed',String(on));x.classList.toggle('active',on);});},'option-card'+(c.value===option.value?' active':''));b.dataset.choice=option.value;b.setAttribute('aria-pressed',String(c.value===option.value));choices.append(b);});stage.append(choices);
      }else g.nodes.forEach(n=>{n.hidden=false;stage.append(n);});
      if(index>0)nav.append(smallButton('Atrás',()=>{index--;show();}));
      nav.append(smallButton(index===groups.length-1?'Ver cómo queda':'Continuar',()=>{if(index===groups.length-1)review=true;else index++;show();},'primary'));
      nav.append(smallButton('Dejar para después',()=>{if(index===groups.length-1)review=true;else index++;show();}));
      nav.append(smallButton('Revisar y guardar',()=>{review=true;show();}));
    }
    form.addEventListener('submit',event=>{if(form.dataset.guidedReady!=='true'){event.preventDefault();event.stopImmediatePropagation();review=true;show();}},true);
    show();
  });
}

function focusActiveQuestion() {
  const panel=root.querySelector('.edit-panel:has(form[data-guided]),.bottom-panel:has(form[data-guided])');
  if(!panel)return;
  const content=panel.closest('.content');if(!content)return;
  content.classList.add('focused-edit');
  let active=panel;
  while(active.parentElement&&active.parentElement!==content){
    [...active.parentElement.children].forEach(sibling=>{if(sibling!==active)sibling.hidden=true;});
    active=active.parentElement;
  }
  [...content.children].forEach(sibling=>{if(sibling!==active&&!sibling.classList.contains('breadcrumb'))sibling.hidden=true;});
}

function handleReviewAction(action,value) {
  if (action === 'start' || action === 'resume') { state.answers = Object.keys(p().answers).length ? structuredClone(p().answers) : state.answers; state.questionKey = action === 'resume' ? p().cursor || state.questionKey || 'owner' : state.questionKey || 'owner'; state.screen='onboarding';state.panel=null;state.returnToSummary=false;render();return true; }
  if (action === 'manual' || action === 'explore') { if(state.screen==='onboarding')saveGuide();state.manualChoosingRoute=Boolean(state.answers.route)?false:true;go(action);return true; }
  if(action==='manual-route-change'){state.manualChoosingRoute=true;render();return true;}
  if(action==='manual-route-pick'){state.route=value;p();state.answers=structuredClone(p().answers);state.manualChoosingRoute=false;render();return true;}
  if (action === 'manual-open') { if(value==='studio')state.studio='create';go(value);return true; }
  if (action === 'open-next') { if(value==='studio')state.studio='create';go(value);return true; }
  if (action === 'campaign-create') { const campaign=p().campaigns.find(x=>x.id===value);if(campaign){state.campaignId=value;state.phase=Math.max(0,phases.indexOf(campaign.goal));const [kind,id]=String(campaign.offer||'').split(':');state.sourceProduct=kind==='product'?id:'';state.sourcePromotion=kind==='promotion'?id:'';state.sourceSection='';state.studio='create';go('studio');}return true; }
  if (action === 'from-product') { state.sourceProduct=value;state.sourcePromotion='';state.sourceSection='';state.studio='create';go('studio');return true; }
  if (action === 'from-section'||action==='select-source') { state.sourceProduct='';state.sourcePromotion='';state.sourceSection=value;state.studio='create';go('studio');return true; }
  if (action === 'select-answer') {
    const q=questionNow();
    if(q.multi){const vals=list(state.answers[q.key]);const on=vals.includes(value);let next=on?vals.filter(x=>x!==value):[...vals,value];const exclusive=['Ninguno todavía','Ninguna todavía','Nada en particular','Todavía no lo sé','Por ahora, seguir con lo elegido'];if(!on&&exclusive.includes(value))next=[value];else if(!on)next=next.filter(x=>!exclusive.includes(x));state.answers[q.key]=next;}
    else state.answers[q.key]=value;
    if(q.key==='route')adoptAnswerRoute();voiceOpen=false;render();return true;
  }
  if(action==='question-next'||action==='skip-question'){
    const q=questionNow(),key=q.key;
    if(action==='skip-question'){delete state.answers[key];delete state.answers[q.customKey||key+'Custom'];if(key==='marketingStart')state.answers.marketingStart='Más adelante';}
    adoptAnswerRoute();saveGuide();voiceOpen=false;
    if(state.returnToSummary&&key!=='otherAreas'){state.returnToSummary=false;go('summary');return true;}state.returnToSummary=false;
    const qs=buildQuestions(),index=qs.findIndex(x=>x.key===key);if(index===qs.length-1)go('summary');else{state.questionKey=qs[index+1].key;saveGuide();render();}return true;
  }
  if(action==='question-back'){const qs=buildQuestions(),i=qs.findIndex(x=>x.key===questionNow().key);state.questionKey=qs[Math.max(0,i-1)].key;saveGuide();voiceOpen=false;render();return true;}
  if(action==='pause-guide'){saveGuide();state.notice='Tu avance de la maqueta está guardado; puedes retomarlo.';go('welcome');return true;}
  if(action==='show-summary'){saveGuide();go('summary');return true;}
  if(action==='edit-answer'){if(['intent','comfort','resources'].includes(value)&&state.answers.marketingStart==='Más adelante')state.answers.marketingStart='Quiero prepararla ahora';state.questionKey=value;state.returnToSummary=true;state.screen='onboarding';state.panel=null;render();return true;}
  if(action==='prepare-space'){preparePersonalSpace();return true;}
  if(action==='example'){populateExample(value);return true;}
  if(action==='voice-example'){const q=questionNow();state.answers[q.customKey||q.key+'Custom']='Respuesta de audio de muestra: quiero crear algo cercano y compartirlo a mi ritmo.';voiceOpen=false;saveGuide();render();return true;}
  if(action==='promotion-edit'||action==='studio-preferences'){showPanel(action,value);return true;}
  if(action==='offer-open'){state.offerId=value;go('offer-page');return true;}
  if(action==='save-offer'){state.dirty=false;persist();toast('Borrador de oferta guardado solo en la maqueta. La página principal se conserva.');return true;}
  if(action==='offer-content'||action==='offer-campaign'){state.sourcePromotion=value;state.sourceProduct='';state.sourceSection='';state.studio='create';state.phase=3;if(action==='offer-campaign'){state.screen='studio';showPanel('new-campaign',value);}else go('studio');return true;}
  if(action==='studio-format'){state.format=value;state.panel=null;render();return true;}
  if(action==='task-accept'||action==='task-postpone'||action==='task-remove'){const task=p().tasks.find(x=>x.id===value);if(task){task.acceptance=action==='task-accept'?'accepted':action==='task-postpone'?'postponed':'removed';if(action==='task-remove'){task.removed=true;state.panel=null;}persist();render();}return true;}
  if(action==='task-tool'){const task=p().tasks.find(x=>x.id===value);if(task){if(task.id==='route-cost')state.opTab=2;if(task.tool==='studio')state.studio='create';go(task.tool);}return true;}
  if(action==='scenario-new'){state.projects[state.route]=projectFor(state.route,false);state.answers={route:routes[state.route].label};state.questionKey=null;state.scenario='new';go('map');return true;}
  if(action==='scenario-existing'||action==='existing'){populateExample('existing');return true;}
  if(action==='nav'&&value==='ready'&&!p().plan){go('summary');return true;}
  return false;
}
root.addEventListener('click',event=>{
  const target=event.target.closest('[data-action]');if(!target||target.disabled)return;
  if(handleReviewAction(target.dataset.action,target.dataset.value)){event.preventDefault();event.stopImmediatePropagation();}
},true);
root.addEventListener('input',event=>{
  const el=event.target;
  if(el.dataset.newanswer){state.answers[el.dataset.newanswer]=el.value;return;}
  if(el.dataset.promotionTitle){const promo=p().promotions.find(x=>x.id===el.dataset.promotionTitle);if(promo)promo.title=el.innerText;state.dirty=true;return;}
  if(['hero','description','story'].includes(el.dataset.edit))p().pageTouched=true;
},true);
root.addEventListener('change',event=>{
  const el=event.target;
  if(el.matches('[data-manual-route]')){state.route=el.value;p();state.answers=structuredClone(p().answers);render();event.stopImmediatePropagation();}
  if(el.matches('[data-studio-source]')){state.sourceProduct='';state.sourcePromotion='';state.sourceSection='';const [kind,id]=el.value.split(':');if(kind==='product')state.sourceProduct=id;if(kind==='promotion')state.sourcePromotion=id;render();event.stopImmediatePropagation();}
  if(el.matches('[data-studio-campaign]')){state.campaignId=el.value;render();event.stopImmediatePropagation();}
  if(el.matches('[data-route]')){const route=el.value;state.route=route;p();state.answers=structuredClone(p().answers);state.questionKey=p().cursor||null;state.screen='map';state.panel=null;state.pieceId=null;state.sourceProduct='';state.sourcePromotion='';state.sourceSection='';state.campaignId='';state.opTab=0;persist();render();event.stopImmediatePropagation();}
},true);
root.addEventListener('submit',event=>{
  const form=event.target;if(form.dataset.guided==='true'&&form.dataset.guidedReady!=='true'){event.preventDefault();event.stopImmediatePropagation();return;}if(!['promotion','review-campaign'].includes(form.dataset.form))return;
  event.preventDefault();event.stopImmediatePropagation();const data=new FormData(form),get=k=>String(data.get(k)||'').trim();
  if(form.dataset.form==='promotion'){
    if(!get('title')){state.notice='Ponle un nombre a esta oferta de muestra.';render();return;}
    const previous=p().promotions.find(x=>x.id===state.panel.id),id=previous?.id||uid();const value={id,title:get('title'),productId:get('product'),benefit:get('benefit'),description:get('description'),price:get('price'),conditions:get('conditions'),period:get('period'),cta:get('cta')||'Quiero saber más',draft:true,suggested:false};if(previous)Object.assign(previous,value);else p().promotions.push(value);state.offerId=id;state.screen='offer-page';
  }else{
    if(!get('name')){state.notice='Añade un nombre para reconocer tu campaña.';render();return;}
    const id=uid();p().campaigns.push({id,name:get('name'),goal:get('goal'),offer:get('offer'),date:get('date')});state.campaignId=id;state.phase=Math.max(0,phases.indexOf(get('goal')));const [kind,source]=get('offer').split(':');state.sourceProduct=kind==='product'?source:'';state.sourcePromotion=kind==='promotion'?source:'';state.studio='create';state.screen='studio';
  }
  state.panel=null;state.dirty=false;persist();render();
},true);

/* Reconstruct only the small review additions; never read application storage. */
state.account=state.account||{owner:'',addressing:'En lenguaje neutral'};
for(const [route,project] of Object.entries(state.projects)){project.answers=project.answers||{};project.promotions=project.promotions||[];if(project.prepared)project.plan=reviewModel.derive(route,project.answers);}
if(!Object.keys(state.answers).length)state.answers=structuredClone(p().answers);

render();
if(window.Tweak){const visual={spacing:'Cómoda',aura:.12};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--fu-gap',visual.spacing==='Compacta'?'16px':'24px');root.style.setProperty('--fu-aura',String(visual.aura));root.dataset.density=visual.spacing;}});tweak.addSelect(visual,'spacing',{label:'Espaciado de la experiencia',options:['Cómoda','Compacta']});tweak.addSlider(visual,'aura',{label:'Intensidad de acentos',min:.04,max:.2,step:.04});}
})();
</script>
</div>

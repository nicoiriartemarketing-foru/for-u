<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOR U</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;padding:32px;background:linear-gradient(180deg,#FAFAF8 0%,#F5F3F0 100%);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#3A3A4A;">
        <section style="max-width:760px;text-align:center;border:1px solid rgba(212,175,55,.22);border-radius:18px;background:rgba(248,246,243,.92);box-shadow:0 18px 50px rgba(58,58,74,.08);padding:42px 28px;">
          <p style="margin:0 0 12px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#8A6D17;">FOR U</p>
          <h1 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(42px,7vw,72px);line-height:.95;font-weight:600;">Deja de abrumarte con tus ideas.</h1>
          <p style="margin:18px auto 0;max-width:560px;font-size:18px;line-height:1.7;color:#6B6B7B;">For U las convierte en acciones claras. Tan útil como una jefa amable, tan bonito como ver tus proyectos cobrar vida.</p>
          <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px;">
            <a href="/register" style="border:1px solid rgba(212,175,55,.32);border-radius:999px;padding:13px 20px;background:linear-gradient(135deg,#D4AF37 0%,#E8D5F5 50%,#D5E8E0 100%);color:#3A3A4A;text-decoration:none;font-weight:700;">Empezar gratis</a>
            <a href="/login" style="border:1px solid rgba(58,58,74,.14);border-radius:999px;padding:13px 20px;background:#F8F6F3;color:#3A3A4A;text-decoration:none;font-weight:700;">Entrar</a>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
